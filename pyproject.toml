[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk"
version = "0.1.0"
description = "Corporate credit-risk modeling on UCI Polish bankruptcy data"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "torch>=2.0"
]

[project.scripts]
credit-risk = "credit_risk.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
